name: Android APKs

on:
  push:
    branches:
      - feat/spotify-primary-provider
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Dev debug APK (separate package; does not replace installed app)
        run: ./gradlew --no-daemon assembleDevDebug

      - name: Upload Dev APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure original release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > original-signing.jks
          {
            echo "storeFile=original-signing.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build Prod release APK signed with the supplied original key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon assembleProdRelease

      - name: Upload signed Prod release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain why the updateable APK was skipped
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "No original keystore configured. Only the separate Dev APK was built; it cannot update the installed production app."
